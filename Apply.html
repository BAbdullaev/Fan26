<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enroll — Falah Academy of Nashville</title>
<meta name="robots" content="noindex">
<!-- The application itself lives in SchoolPro, so every "Enroll now" button
     on the site links there directly. This page only exists to catch anyone
     arriving on the old /Apply.html URL — an old bookmark, an emailed link —
     and send them on. -->
<meta http-equiv="refresh" content="0;url=https://app.schoolpro.us/Application/StudentRegistration/38708">
<link rel="icon" href="assets/logo.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#FDF8EE;color:#1F3D2B;font-family:'Nunito',sans-serif}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;box-sizing:border-box}
img{width:76px;height:76px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 4px 14px rgba(20,60,35,.18)}
h1{font:600 30px 'Fredoka',sans-serif;color:#153A26;margin:22px 0 8px}
p{font:600 16px/1.6 'Nunito',sans-serif;color:#41573F;margin:0 0 26px;max-width:420px}
a{text-decoration:none;font:800 16px 'Nunito',sans-serif;color:#153A26;background:#F7941D;padding:15px 30px;border-radius:999px;box-shadow:0 4px 0 #C9720A;display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <img src="assets/logo.jpeg" alt="Falah Academy of Nashville crest">
  <h1>Taking you to our application…</h1>
  <p>If nothing happens in a moment, use the button below.</p>
  <a href="https://app.schoolpro.us/Application/StudentRegistration/38708">Apply Now</a>
</div>
<script>
  // replace() rather than assign() so Back returns to the page they came
  // from, not into this redirect loop
  location.replace('https://app.schoolpro.us/Application/StudentRegistration/38708');
</script>
</body>
</html>
